server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ponytail: every internal link already uses .html; $uri.html just makes
    # extensionless URLs work too. Swap for a rewrite map if paths get nested.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
