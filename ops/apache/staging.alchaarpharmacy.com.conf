<VirtualHost *:80>
    ServerName staging.alchaarpharmacy.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    RequestHeader set X-Forwarded-Proto "http"
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"

    ErrorLog ${APACHE_LOG_DIR}/staging.alchaarpharmacy.com-error.log
    CustomLog ${APACHE_LOG_DIR}/staging.alchaarpharmacy.com-access.log combined
</VirtualHost>
