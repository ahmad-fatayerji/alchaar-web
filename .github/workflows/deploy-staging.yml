name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: alchaar-web-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy staging with Podman Quadlet
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="$HOME/alchaar-web-staging"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch staging --single-branch \
                https://github.com/ahmad-fatayerji/alchaar-web.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR" || true
            git fetch origin +refs/heads/staging:refs/remotes/origin/staging
            git checkout --force -B staging origin/staging
            mkdir -p "$APP_DIR/shared"
            touch "$APP_DIR/shared/.env.production"
            chmod 600 "$APP_DIR/shared/.env.production"
            chmod +x "$APP_DIR/ops/podman-quadlet-deploy-staging.sh"
            APP_DIR="$APP_DIR" "$APP_DIR/ops/podman-quadlet-deploy-staging.sh"
